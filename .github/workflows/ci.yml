name: Validate extension

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install build and GJS dependencies
        run: sudo apt-get update && sudo apt-get install -y gjs gir1.2-soup-3.0 libglib2.0-bin gettext zip unzip
      - name: Test parsing, accounts and real HTTP request lifecycle
        run: make test
      - name: Build and verify installable archive
        run: |
          ./package.sh
          python3 tests/package.test.py
